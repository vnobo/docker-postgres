name: Build postgres-zhparser

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '3 12 7 * *'

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: postgres
  POSTGRES_VERSION: "18"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Docker Hub publishing is optional: set DOCKER_USERNAME / DOCKER_PASSWORD repo secrets.
      # When unset, DOCKERHUB_IMAGE is empty and the Docker Hub login + push are skipped.
      DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME != '' && format('docker.io/{0}/postgres', secrets.DOCKER_USERNAME) || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
            suffix=-zhparser
          tags: |
            type=raw,value=${{ env.POSTGRES_VERSION }}
            type=ref,event=tag

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./zhparser
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Smoke test (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.POSTGRES_VERSION }}-zhparser"
          docker run -d --name pgtest -e POSTGRES_PASSWORD=test -p 5432:5432 "$IMAGE"
          trap 'docker rm -f pgtest' EXIT
          for i in $(seq 1 30); do
            if docker exec pgtest pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker cp zhparser/zhparser.sql pgtest:/zhparser.sql
          docker exec -e PGPASSWORD=test pgtest psql -U postgres -f /zhparser.sql
